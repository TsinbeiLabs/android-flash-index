name: update-index

on:
  schedule:
    # 06:00 UTC daily — shortly after Google's usual image publishes
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      sizes_all:
        description: "HEAD-probe every build, not just active ones (slow, thousands of requests)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - scrape.py
      - app.js
      - .github/workflows/update-index.yml

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape flash.android.com
        run: |
          if [ "${{ inputs.sizes_all }}" = "true" ]; then
            python scrape.py --sizes-all
          else
            python scrape.py
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh index $(date -u +%Y-%m-%d)"
            git push
          fi
